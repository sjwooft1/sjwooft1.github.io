<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Organizer — Race Timer</title>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

  <style>
    :root{--accent:#ff7f11;--bg:#f7f7f7}
    body{font-family:Roboto,system-ui,-apple-system,Segoe UI,Arial; margin:0; background:var(--bg); color:#111}
    .navbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.06);position:sticky;top:0;z-index:1000}
    .container{padding:14px}
    #map{height:420px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.06);width:100%}
    .top-toolbar{display:flex;gap:8px;align-items:center;padding:10px 14px;background:#fff;border-bottom:1px solid #eee}
    .btn{background:var(--accent);color:#fff;border:0;padding:8px 10px;border-radius:8px;cursor:pointer}
    .btn.secondary{background:#eee;color:#111}
    .muted{color:#666;font-size:13px}

    /* timing modal */
    .timing-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:12000;align-items:center;justify-content:center}
    .timing-modal.open{display:flex}
    .timing-content{background:#fff;border-radius:12px;padding:16px;width:1000px;max-width:96vw;max-height:92vh;overflow:auto}
    .timing-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
    .stat-card{background:#f8f9fa;padding:10px;border-radius:8px;text-align:center}
    .stat-number{font-weight:700;color:var(--accent)}
    .runners-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;max-height:420px;overflow:auto;padding:6px;background:#f8f9fa;border-radius:8px}
    .runner-card{background:#fff;border-radius:8px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06);cursor:pointer;transition:transform .06s ease,background-color .08s}
    .runner-card:active{transform:scale(.98);background:#eef9ff}
    .runner-card.finished{border:2px solid #28a745;background:#f8fff9}
    .runner-name{font-weight:700;margin:0}
    .runner-details{color:#666;font-size:13px;margin:0}
    .runner-time{font-weight:700;text-align:right}
    .search-box{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin-bottom:12px}
    @media (max-width:800px){ .timing-stats{grid-template-columns:repeat(2,1fr)} .runners-grid{grid-template-columns:1fr;max-height:320px} }
  </style>
</head>
<body>
  <nav class="navbar">
    <div style="font-weight:700;color:var(--accent)">Brighton Oaks 5k — Organizer</div>
    <div>
      <a href="index.html" style="margin-right:12px;color:var(--accent);text-decoration:none;font-weight:600">Home</a>
      <a href="registration.html" style="margin-right:12px;color:#333;text-decoration:none">Register</a>
      <a href="results.html" style="color:#333;text-decoration:none">Results</a>
    </div>
  </nav>

  <div class="top-toolbar">
    <button id="openTiming" class="btn">Timing</button>
    <button id="openRegistrations" class="btn secondary">Registrations</button>
    <button id="openResults" class="btn secondary">Results</button>
    <div style="margin-left:auto" class="muted">Data saved to Firebase + localStorage</div>
  </div>

  <div class="container">
    <div id="map"></div>
  </div>

  <div id="notification" style="display:none;position:fixed;top:16px;right:16px;padding:10px 14px;border-radius:8px;color:#fff;background:#28a745;z-index:13000"></div>

  <!-- Timing modal -->
  <div id="timingModal" class="timing-modal" aria-hidden="true">
    <div class="timing-content" role="dialog" aria-modal="true">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h2 style="margin:0">Timing Screen</h2>
        <button id="closeTiming" class="btn secondary">Close</button>
      </div>

      <div class="timing-stats">
        <div class="stat-card"><div class="stat-number" id="totalCount">0</div><div class="stat-label">Total</div></div>
        <div class="stat-card"><div class="stat-number" id="finishedCount">0</div><div class="stat-label">Finished</div></div>
        <div class="stat-card"><div class="stat-number" id="remainingCount">0</div><div class="stat-label">Remaining</div></div>
        <div class="stat-card"><div class="stat-number" id="clockDisplay">00:00.000</div><div class="stat-label">Race Time</div></div>
      </div>

      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <button id="startRace" class="btn">Start Race</button>
        <button id="pauseRace" class="btn secondary">Pause</button>
        <button id="resetRace" class="btn secondary">Reset</button>
        <button id="finishAll" class="btn secondary">Finish All Remaining</button>
        <div style="margin-left:auto"><button id="finishNext" class="btn">Finish Next</button></div>
      </div>

      <input id="runnerSearch" class="search-box" placeholder="Search name or bib...">

      <div id="runnersGrid" class="runners-grid" aria-live="polite"></div>

      <div style="margin-top:10px;color:#666;font-size:13px">Tip: Tap any runner card to instantly record finish. Press F to finish next unfinished.</div>
    </div>
  </div>

  <!-- Registrations modal -->
  <div id="registrationsModal" class="timing-modal">
    <div class="timing-content">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h2 style="margin:0">Registrations</h2>
        <button id="closeRegistrationsBtn" class="btn secondary">Close</button>
      </div>
      <div id="registrationsArea"></div>
    </div>
  </div>

  <!-- Results modal -->
  <div id="resultsModal" class="timing-modal">
    <div class="timing-content">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h2 style="margin:0">Results</h2>
        <button id="closeResultsBtn" class="btn secondary">Close</button>
      </div>
      <div id="resultsArea"></div>
    </div>
  </div>

  <!-- libs -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <script type="module">
  /************************************************************************
   * Organizer — single-file app (fixed Firebase integration + instant finish)
   ************************************************************************/

  // ---------- Firebase config (from you) ----------
  const firebaseConfig = {
    apiKey: "AIzaSyDUnAV-DL-Saw2ByPY6GF8aDaZbVCXDIH4",
    authDomain: "the-race-organizer.firebaseapp.com",
    databaseURL: "https://the-race-organizer-default-rtdb.firebaseio.com",
    projectId: "the-race-organizer",
    storageBucket: "the-race-organizer.firebasestorage.app",
    messagingSenderId: "265977321479",
    appId: "1:265977321479:web:23d3f3077e8e766323b2a2",
    measurementId: "G-PKGPD78DYM"
  };

  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getDatabase, ref, set, push, onValue, get, remove } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

  // Initialize Firebase (and expose lightweight wrappers used by the rest of the script)
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  window.mainDb = db;
  window.mainRef = ref;
  window.mainSet = set;
  // also expose helpers for dynamic imports in older code sections
  window.firebaseDb = db;
  window.firebaseDatabase = { getDatabase, ref, set, push, onValue, get, remove };

  // ---------- State ----------
  const state = {
    route: [],
    runners: [],           // each runner: { id, name, estimatedTime, finishTime, finishedAt, size }
    raceStart: null,       // timestamp ms
    running: false,
    paused: false,
    pausedAt: null
  };

  // ---------- Utilities ----------
  function showNotification(msg, type='success'){
    const el = document.getElementById('notification');
    el.style.background = type === 'error' ? '#dc3545' : '#28a745';
    el.textContent = msg; el.style.display='block';
    setTimeout(()=> el.style.display='none', 1800);
  }
  function formatMs(ms){
    if (ms == null) return '—';
    const t = Math.max(0, Math.floor(ms));
    const m = Math.floor(t/60000);
    const s = Math.floor((t%60000)/1000);
    const msPart = t%1000;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(msPart).padStart(3,'0')}`;
  }
  function makeId(){ return Math.random().toString(36).slice(2,9); }

  function saveLocal(){
    try {
      localStorage.setItem('organizer_state_v1', JSON.stringify({
        route: state.route,
        runners: state.runners,
        raceStart: state.raceStart,
        running: state.running,
        paused: state.paused,
        pausedAt: state.pausedAt
      }));
    } catch(e){ console.warn('saveLocal failed', e); }
  }
  function loadLocal(){
    try {
      const raw = localStorage.getItem('organizer_state_v1');
      if (!raw) return;
      const obj = JSON.parse(raw);
      state.route = obj.route || [];
      state.runners = obj.runners || [];
      state.raceStart = typeof obj.raceStart === 'number' ? obj.raceStart : null;
      state.running = !!obj.running;
      state.paused = !!obj.paused;
      state.pausedAt = obj.pausedAt || null;
    } catch(e){ console.warn('loadLocal failed', e); }
  }

  // ---------- Map ----------
  const map = L.map('map').setView([39.8283, -98.5795], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
  let poly = L.polyline([], {color: '#ff7f11'}).addTo(map);
  let markers = [];
  function refreshRouteDisplay(){
    markers.forEach(m=>map.removeLayer(m)); markers=[];
    poly.setLatLngs(state.route);
    state.route.forEach(pt=>{ markers.push(L.circleMarker(pt,{radius:6}).addTo(map)); });
  }
  map.on('click', e=>{ state.route.push({lat:e.latlng.lat, lng:e.latlng.lng}); refreshRouteDisplay(); saveLocal(); });

  // ---------- Runners — add / render / load ----------
  function addRunnerObj(obj){
    // preserve provided id (from Firebase). only generate if missing
    obj.id = obj.id || makeId();
    obj.finishTime = obj.finishTime || null;
    obj.finishedAt = obj.finishedAt || null;
    state.runners.push(obj);
    renderRunners();
    saveLocal();
  }

  function renderRunners(){
    // For the main registrations area (if exists)
    const container = document.getElementById('runnersList');
    if (!container) return;
    container.innerHTML = '';
    const sorted = [...state.runners].sort((a,b)=>(a.estimatedTime||0)-(b.estimatedTime||0));
    sorted.forEach((r,i)=>{
      const bib = String(i+1).padStart(4,'0');
      const el = document.createElement('div');
      el.className = 'runner-row';
      el.innerHTML = `<strong>${escapeHtml(r.name)}</strong><div class="muted">Bib: ${bib} | Est: ${r.estimatedTime ? formatMs(r.estimatedTime) : '—'}</div>`;
      container.appendChild(el);
    });
  }

  function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ---------- Race clock ----------
  function currentElapsed(){
    if (state.raceStart==null) return 0;
    if (state.paused && state.pausedAt!=null) return state.pausedAt - state.raceStart;
    return Date.now() - state.raceStart;
  }
  let raf = null;
  function tick(){
    if (!state.running) return;
    const el = document.getElementById('clockDisplay');
    if (el) el.textContent = formatMs(currentElapsed());
    raf = requestAnimationFrame(tick);
  }
  function startRace(){
    if (state.raceStart == null){ state.raceStart = Date.now(); state.running = true; state.paused = false; state.pausedAt = null; raf = requestAnimationFrame(tick); }
    else if (state.paused){ const resume = Date.now(); const pausedDur = resume - state.pausedAt; state.raceStart += pausedDur; state.paused=false; state.pausedAt=null; state.running=true; raf = requestAnimationFrame(tick); }
    saveLocal(); updateTimingScreen(); writeRaceClockToFirebase();
  }
  function togglePause(){
    if (state.raceStart==null) return;
    if (state.running){ state.paused=true; state.pausedAt = Date.now(); state.running=false; cancelAnimationFrame(raf); }
    else if (state.paused){ const resume = Date.now(); const pausedDur = resume - state.pausedAt; state.raceStart += pausedDur; state.paused=false; state.pausedAt=null; state.running=true; raf = requestAnimationFrame(tick); }
    saveLocal(); updateTimingScreen(); writeRaceClockToFirebase();
  }
  function resetRace(){
    state.raceStart = null; state.running = false; state.paused=false; state.pausedAt=null; cancelAnimationFrame(raf);
    state.runners.forEach(r=>{ r.finishTime = null; r.finishedAt = null; });
    saveLocal(); renderTimingRunners(); updateTimingScreen();
    // clear firebase clock & results? leave to button
  }

  // ---------- Finishing ----------
  function finishRunner(id){
    const r = state.runners.find(x=>x.id===id);
    if (!r) return;
    if (r.finishTime != null) return;
    if (state.raceStart == null) { showNotification('Race not started','error'); return; }

    const elapsed = currentElapsed();
    r.finishTime = elapsed;
    r.finishedAt = Date.now();
    saveLocal();

    // minimal feedback
    try { if (navigator.vibrate) navigator.vibrate(40); } catch(e){}
    const card = document.querySelector(`[data-runner-id="${id}"]`);
    if (card) card.classList.add('finished');

    // Save to Firebase (results/<id>)
    try {
      const allSorted = [...state.runners].sort((a,b)=>(a.estimatedTime||0)-(b.estimatedTime||0));
      const bibIndex = allSorted.findIndex(x=>x.id===id);
      const bib = bibIndex>=0 ? String(bibIndex+1).padStart(4,'0') : '—';
      set(ref(db, 'results/' + id), {
        name: r.name,
        bibNumber: bib,
        estimatedTime: r.estimatedTime || null,
        finishTime: r.finishTime,
        finishedAt: r.finishedAt
      });
    } catch(e){ console.warn('firebase write failed', e); }

    renderTimingRunners();
    updateTimingScreen();
  }

  // Finish next unfinished runner (by estimated time then FIFO)
  function finishNext(){
    if (state.raceStart==null) { showNotification('Start race first','error'); return; }
    const next = [...state.runners].filter(r=>r.finishTime==null && r.estimatedTime!=null).sort((a,b)=>a.estimatedTime-b.estimatedTime)[0]
               || [...state.runners].filter(r=>r.finishTime==null)[0];
    if (!next) { showNotification('No remaining runners'); return; }
    finishRunner(next.id);
    autoScrollTo(next.id);
  }

  // Finish all remaining (bulk)
  async function finishAllRemaining(){
    if (state.raceStart==null){ alert('Start race first'); return; }
    const remaining = state.runners.filter(r=>r.finishTime==null);
    if (remaining.length===0){ alert('No remaining runners'); return; }
    if (!confirm(`Finish ${remaining.length} remaining runners?`)) return;
    const elapsed = currentElapsed();
    for (const r of remaining){ r.finishTime = elapsed; r.finishedAt = Date.now(); 
      try { const allSorted = [...state.runners].sort((a,b)=>(a.estimatedTime||0)-(b.estimatedTime||0)); const bibIndex = allSorted.findIndex(x=>x.id===r.id); const bib = bibIndex>=0?String(bibIndex+1).padStart(4,'0'):'—';
            await set(ref(db, 'results/' + r.id), { name: r.name, bibNumber: bib, estimatedTime: r.estimatedTime||null, finishTime: r.finishTime, finishedAt: r.finishedAt }); } catch(e){ console.warn(e); }
    }
    saveLocal(); renderTimingRunners(); updateTimingScreen(); showNotification(`Finished ${remaining.length}`);
  }

  // ---------- Timing UI Render ----------
  let searchTerm = '';
  function renderTimingRunners(){
    const grid = document.getElementById('runnersGrid');
    if (!grid) return;
    const sorted = [...state.runners].sort((a,b)=>(a.estimatedTime||0)-(b.estimatedTime||0));
    grid.innerHTML = '';
    sorted.forEach((r, idx)=>{
      const bib = String(idx+1).padStart(4,'0');
      const isFinished = r.finishTime != null;
      if (searchTerm){
        const s = searchTerm.toLowerCase();
        if (!( (r.name||'').toLowerCase().includes(s) || bib.includes(s) )) return;
      }
      const card = document.createElement('div');
      card.className = 'runner-card' + (isFinished ? ' finished' : '');
      card.setAttribute('data-runner-id', r.id);
      card.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div class="runner-name">${escapeHtml(r.name)}</div>
            <div class="runner-details">Bib #${bib} • Est: ${r.estimatedTime ? formatMs(r.estimatedTime) : '—'}</div>
          </div>
          <div style="min-width:110px;text-align:right;">
            <div class="runner-time">${isFinished ? formatMs(r.finishTime) : (state.running ? formatMs(currentElapsed()) : '00:00.000')}</div>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // auto-scroll helper
  function autoScrollTo(id){
    const el = document.querySelector(`[data-runner-id="${id}"]`);
    if (el) el.scrollIntoView({behavior:'smooth',block:'center'});
  }

  // instant tap-to-finish handler (delegated)
  let lastTap = 0;
  function timingGridClick(e){
    const card = e.target.closest('.runner-card');
    if (!card) return;
    const now = Date.now();
    if (now - lastTap < 80) return;
    lastTap = now;
    const id = card.getAttribute('data-runner-id');
    const runner = state.runners.find(r=>r.id===id);
    if (!runner) return;
    if (state.running && runner.finishTime == null && state.raceStart != null) {
      finishRunner(id);
      // scroll to next
      setTimeout(()=>{ const next = state.runners.find(r=>r.finishTime==null); if (next) autoScrollTo(next.id); }, 100);
    }
  }

  // ---------- Loading from Firebase ----------
  // Load registrations (preserve the 
async function loadRegistrationsIntoRunners(){
  try {
    // Always clear runners completely to prevent duplicates
    state.runners = [];
    saveLocal();  // overwrite local copy so duplicates never reappear

    const registrationsRef = ref(db, 'registrations');
    const snap = await get(registrationsRef);

    if (!snap.exists()){
      showNotification('No registrations found','warning');
      return;
    }

    const regsObj = snap.val();

    // Load all runners fresh from Firebase
    Object.entries(regsObj).forEach(([id, reg]) => {
      addRunnerObj({
        id: id,
        name: reg.name || 'Unknown',
        estimatedTime: reg.estimatedTime || null,
        size: reg.size || null
      });
    });

    // Now merge results
    await loadResultsIntoRunners();

    showNotification(`Loaded ${Object.keys(regsObj).length} registrations`);

  } catch (e){
    console.error('loadRegs error', e);
    showNotification('Failed to load registrations','error');
  }
}
      // merge any existing results
      await loadResultsIntoRunners();
      showNotification(`Loaded ${Object.keys(regsObj).length} registrations`);
    } catch (e){
      console.error('loadRegs error', e);
      showNotification('Failed to load registrations','error');
    }
  }

  // Load existing results and merge
  async function loadResultsIntoRunners(){
    try {
      const resultsRef = ref(db, 'results');
      const snap = await get(resultsRef);
      if (!snap.exists()) return;
      const resultsObj = snap.val();
      Object.entries(resultsObj).forEach(([id, res])=>{
        const local = state.runners.find(r=>r.id===id);
        if (local){
          local.finishTime = res.finishTime || local.finishTime;
          local.finishedAt = res.finishedAt || local.finishedAt;
        } else {
          // If a result exists but no registration (rare), include it so results view shows it
          state.runners.push({
            id: id,
            name: res.name || 'Unknown',
            estimatedTime: res.estimatedTime || null,
            finishTime: res.finishTime || null,
            finishedAt: res.finishedAt || null
          });
        }
      });
      saveLocal(); renderTimingRunners(); updateTimingScreen();
    } catch(e){ console.warn('loadResults err', e); }
  }

  async function loadRaceStateFromFirebase(){
    try {
      const clockRef = ref(db, 'raceClock');
      const snap = await get(clockRef);
      if (snap.exists()){
        const data = snap.val();
        if (data){
          state.raceStart = data.raceStart || state.raceStart;
          state.running = !!data.running;
          state.paused = !!data.paused;
          state.pausedAt = data.pausedAt || null;
          if (state.running) { raf = requestAnimationFrame(tick); }
        }
      }
      // load registrations + results
      await loadRegistrationsIntoRunners();
    } catch(e){ console.warn('loadRaceStateFromFirebase', e); }
  }

  // ---------- Firebase helpers ----------
  async function writeRaceClockToFirebase(){
    try {
      await set(ref(db, 'raceClock'), {
        raceStart: state.raceStart,
        running: state.running,
        paused: state.paused,
        pausedAt: state.pausedAt
      });
    } catch(e){ console.warn(e); }
  }

  // ---------- Registrations management UI ----------
  async function viewRegistrationsUI(){
    try {
      const registrationsRef = ref(db, 'registrations');
      const snap = await get(registrationsRef);
      const area = document.getElementById('registrationsArea');
      area.innerHTML = '';
      if (!snap.exists()){ area.innerHTML = '<div class="muted">No registrations</div>'; return; }
      const regs = snap.val();
      const rows = Object.entries(regs).sort((a,b)=>(a[1].estimatedTime||0)-(b[1].estimatedTime||0));
      const table = document.createElement('table'); table.style.width='100%';
      table.innerHTML = '<thead><tr style="background:#f8f9fa"><th>Name</th><th>Est</th><th>Size</th><th>Registered</th><th>Actions</th></tr></thead>';
      const tbody = document.createElement('tbody');
      rows.forEach(([id, reg], i)=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><strong>${escapeHtml(reg.name)}</strong></td>
                        <td>${reg.estimatedTime ? formatMs(reg.estimatedTime) : '—'}</td>
                        <td>${escapeHtml(reg.size||'')}</td>
                        <td>${new Date(reg.registeredAt||0).toLocaleString()}</td>
                        <td><button class="btn secondary" data-id="${id}" data-name="${escapeHtml(reg.name)}">Remove</button></td>`;
        tbody.appendChild(tr);
      });
      table.appendChild(tbody); area.appendChild(table);
      // wire remove buttons
      tbody.querySelectorAll('button').forEach(btn=>{
        btn.addEventListener('click', async (ev)=>{
          const id = btn.getAttribute('data-id');
          const name = btn.getAttribute('data-name');
          if (!confirm(`Remove ${name} from registrations? This also removes results.`)) return;
          try { await remove(ref(db, 'registrations/' + id)); await remove(ref(db, 'results/' + id)); showNotification('Removed'); viewRegistrationsUI(); loadRegistrationsIntoRunners(); } catch(e){ alert('Failed: '+e.message); }
        });
      });
    } catch(e){ console.warn(e); }
  }

  // ---------- Results UI ----------
  function showResultsUI(){
    const area = document.getElementById('resultsArea'); area.innerHTML = '';
    const finished = state.runners.filter(r=>r.finishTime!=null).sort((a,b)=>a.finishTime - b.finishTime);
    if (finished.length===0){ area.innerHTML = '<div class="muted">No finishers yet</div>'; return; }
    const table = document.createElement('table'); table.style.width='100%';
    table.innerHTML = '<thead><tr><th>Place</th><th>Name</th><th>Bib</th><th>Time</th></tr></thead>';
    const tbody = document.createElement('tbody');
    const allSorted = [...state.runners].sort((a,b)=>(a.estimatedTime||0)-(b.estimatedTime||0));
    finished.forEach((r, i)=>{
      const bibIndex = allSorted.findIndex(x=>x.id===r.id);
      const bib = bibIndex>=0 ? String(bibIndex+1).padStart(4,'0') : '—';
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${i+1}</td><td>${escapeHtml(r.name)}</td><td>${bib}</td><td>${formatMs(r.finishTime)}</td>`;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody); area.appendChild(table);
  }

  // ---------- UI wiring ----------
  document.getElementById('openTiming').addEventListener('click', async ()=>{
    document.getElementById('timingModal').classList.add('open');
    await loadRaceStateFromFirebase();
    renderTimingRunners();
    updateTimingScreen();
    const grid = document.getElementById('runnersGrid');
    grid.removeEventListener('click', timingGridClick);
    grid.addEventListener('click', timingGridClick);
  });
  document.getElementById('closeTiming').addEventListener('click', ()=> document.getElementById('timingModal').classList.remove('open'));
  document.getElementById('openRegistrations').addEventListener('click', ()=>{ document.getElementById('registrationsModal').classList.add('open'); viewRegistrationsUI(); });
  document.getElementById('closeRegistrationsBtn').addEventListener('click', ()=> document.getElementById('registrationsModal').classList.remove('open'));
  document.getElementById('openResults').addEventListener('click', ()=>{ document.getElementById('resultsModal').classList.add('open'); showResultsUI(); });
  document.getElementById('closeResultsBtn').addEventListener('click', ()=> document.getElementById('resultsModal').classList.remove('open'));

  document.getElementById('runnerSearch').addEventListener('input', (e)=>{ searchTerm = e.target.value; renderTimingRunners(); });

  document.getElementById('startRace').addEventListener('click', ()=>{ startRace(); writeRaceClockToFirebase(); updateTimingScreen(); });
  document.getElementById('pauseRace').addEventListener('click', ()=>{ togglePause(); writeRaceClockToFirebase(); updateTimingScreen(); });
  document.getElementById('resetRace').addEventListener('click', ()=>{ if(confirm('Reset race and clear finish times?')){ resetRace(); set(ref(db,'raceClock'), null); } });
  document.getElementById('finishNext').addEventListener('click', ()=>{ finishNext(); updateTimingScreen(); });
  document.getElementById('finishAll').addEventListener('click', finishAllRemaining);

  document.addEventListener('keydown', (e)=>{
    const modal = document.getElementById('timingModal');
    if (!modal || !modal.classList.contains('open')) return;
    if (e.key === 'f' || e.key === 'F'){ e.preventDefault(); finishNext(); updateTimingScreen(); }
    if (e.key === 'Escape') modal.classList.remove('open');
  });

  function updateTimingScreen(){
    const total = state.runners.length;
    const finished = state.runners.filter(r=>r.finishTime!=null).length;
    document.getElementById('totalCount').textContent = total;
    document.getElementById('finishedCount').textContent = finished;
    document.getElementById('remainingCount').textContent = total - finished;
    document.getElementById('clockDisplay').textContent = formatMs(currentElapsed());
    renderTimingRunners();
  }

  // ---------- On load ----------
  loadLocal();
  refreshRouteDisplay();
  renderRunners();
  // Start lightweight periodic save
  setInterval(saveLocal, 5000);

  // expose some helpers for console if needed
  window.finishRunner = finishRunner;
  window.loadRegistrationsIntoRunners = loadRegistrationsIntoRunners;
  window.loadResultsIntoRunners = loadResultsIntoRunners;

  </script>
</body>
</html>

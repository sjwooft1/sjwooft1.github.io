<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Weather & Traffic Command | Radar & Live Cameras</title>
    <meta name="description" content="Live weather radar and traffic camera feeds across the region.">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #050505;
            --panel: #141414;
            --accent: #00f3ff;
            --nav-height: 70px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: #e5e5e5;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            -webkit-font-smoothing: antialiased;
        }

        /* === VIEW MANAGEMENT === */
        .view-section {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: calc(100% - var(--nav-height));
            display: none; /* Hidden by default */
            z-index: 10;
        }
        .view-section.active { display: block; }

        /* === MAP VIEW === */
        #map { height: 100%; width: 100%; background: #0d0d0d; }

        /* === CAMERA GRID VIEW === */
        #cam-grid-container {
            padding: 20px;
            overflow-y: auto;
            height: 100%;
            box-sizing: border-box;
            background: linear-gradient(to bottom, #111, #000);
        }

        .grid-header { 
            margin-bottom: 20px; 
            padding-bottom: 15px; 
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            background: #111;
            z-index: 20;
        }
        .grid-header h1 { margin: 0; font-size: 1.35rem; font-weight: 600; color: #fff; letter-spacing: 0.02em; }
        .grid-subtitle { font-size: 0.8rem; color: #888; display: block; margin-top: 4px; }

        .cam-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
            padding-bottom: 80px;
        }

        .cam-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .cam-card:hover { border-color: var(--accent); transform: translateY(-2px); }

        .cam-preview {
            height: 180px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 3rem;
            position: relative;
            overflow: hidden;
        }

        .cam-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cam-preview.loading::after {
            content: "Loading…";
            position: absolute;
            font-size: 0.85rem;
            color: #666;
        }

        .cam-meta { padding: 15px; }
        .cam-title { font-weight: 600; font-size: 1rem; margin-bottom: 5px; }
        .cam-weather { font-family: monospace; color: var(--accent); font-size: 0.85rem; }

        /* === BOTTOM NAV === */
        #nav-bar {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%;
            height: var(--nav-height);
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid #333;
            display: flex;
            z-index: 5000;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            background: none;
            border: none;
            cursor: pointer;
        }
        .nav-item.active { color: var(--accent); background: rgba(0, 243, 255, 0.08); }
        .nav-icon { font-size: 1.1rem; margin-bottom: 4px; opacity: 0.9; }
        .nav-label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.03em; }

        /* === FULLSCREEN OVERLAY === */
        #fs-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            display: none;
        }

        .fs-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 10001;
            backdrop-filter: blur(8px);
            transition: background 0.2s;
        }
        .fs-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .fs-info {
            position: absolute;
            top: 20px; left: 20px;
            z-index: 10001;
            pointer-events: none;
        }
        .fs-title { font-size: 1.2rem; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .fs-weather { color: var(--accent); font-family: monospace; font-size: 1rem; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; display: inline-block; margin-top: 5px; }

        #fs-video-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #fs-video-container video { width: 100%; height: 100%; object-fit: contain; }

        .fs-next {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 243, 255, 0.2);
            color: white;
            border: 1px solid rgba(0, 243, 255, 0.4);
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 10001;
            backdrop-filter: blur(8px);
            transition: background 0.2s;
        }
        .fs-next:hover {
            background: rgba(0, 243, 255, 0.35);
        }

        /* Map camera markers */
        .cam-marker { background: none; border: none; }
        .cam-marker-dot {
            display: block;
            width: 12px; height: 12px;
            background: var(--accent);
            border: 2px solid rgba(0,0,0,0.6);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
        }
        .cam-marker:hover .cam-marker-dot { transform: scale(1.2); }
        .leaflet-popup-content { margin: 10px 14px; min-width: 120px; }
        .map-popup-link { color: var(--accent); text-decoration: none; font-size: 0.85rem; }
        .map-popup-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div id="view-map" class="view-section active">
        <div id="map"></div>
    </div>

    <div id="view-cams" class="view-section">
        <div id="cam-grid-container">
            <div class="grid-header">
                <h1>Live Cameras</h1>
                <span class="grid-subtitle">Traffic feeds with current conditions</span>
            </div>
            <div id="cam-grid" class="cam-grid"></div>
        </div>
    </div>

    <nav id="nav-bar" role="navigation" aria-label="Main">
        <button type="button" class="nav-item active" onclick="switchTab('map')" aria-current="page">
            <span class="nav-icon" aria-hidden="true">◇</span>
            <span class="nav-label">Radar</span>
        </button>
        <button type="button" class="nav-item" onclick="switchTab('cams')">
            <span class="nav-icon" aria-hidden="true">▣</span>
            <span class="nav-label">Cameras</span>
        </button>
    </nav>

    <div id="fs-overlay" role="dialog" aria-modal="true" aria-label="Camera fullscreen">
        <button type="button" class="fs-close" onclick="closeFS()" aria-label="Close">Close</button>
        <button type="button" class="fs-next" onclick="nextCamera()" aria-label="Next camera">Next</button>
        <div class="fs-info">
            <div class="fs-title" id="fs-title-text">Camera</div>
            <div class="fs-weather" id="fs-weather-text">—</div>
        </div>
        <div id="fs-video-container"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

    <script>
        // === DATA CONFIG ===
        const cameras = [
            { id: 'c1', title: 'US-50 @ MM 16.5', url: 'https://vtc3.roadsummary.com/rtplive/CAM004/playlist.m3u8', lat: 39.245052, lon: -81.391205 },
            { id: 'c2', title: 'I-77 @ 176 US 50 I/C', url: 'https://vtc3.roadsummary.com/rtplive/CAM078/playlist.m3u8', lat: 39.267584, lon: -81.499343 },
            { id: 'c3', title: 'Downtown Parkersburg', url: 'https://s117.ipcamlive.com/streams_storage/5ciuewkaxydc4tzjp/stream.m3u8', lat: 39.263304, lon: -81.564240 },
            { id: 'c5', title: 'I-77 Williamstown', url: 'https://vtc3.roadsummary.com/rtplive/CAM103/playlist.m3u8', lat: 39.399095, lon: -81.434647 },
            { id: 'c6', title: 'Charleston WV', url: 'https://wmse-us-ea1.wetmet.net/live/157-06-01/chunks.m3u8?nimblesessionid=28884802&wmsAuthSign=c2VydmVyX3RpbWU9Mi83LzIwMjYgMzoyMjo1OCBQTSZoYXNoX3ZhbHVlPTgyeWVZazkvVDVMQkZwNTdiV2tYeXc9PSZ2YWxpZG1pbnV0ZXM9MzA=', lat: 38.3498, lon: -81.6326 },
            { id: 'c7', title: 'I-79 Clarksburg', url: 'https://vtc1.roadsummary.com/rtplive/CAM028/playlist.m3u8', lat: 39.274573, lon: -80.285608 },
            { id: 'c8', title: 'Wheeling I-70', url: 'https://vtc3.roadsummary.com/rtplive/CAM070/playlist.m3u8', lat: 40.0684, lon: -80.7183 },
            { id: 'c9', title: 'Greenville SC', url: 'https://s53.ipcamlive.com/streams/353btftmcvh5iexku/stream.m3u8', lat: 34.8485, lon: -82.4000 },
            { id: 'c10', title: 'Aiken SC', url: 'https://wmso-us-ea1.wetmet.net/live/191-08-01/chunks.m3u8?nimblesessionid=86645906&wmsAuthSign=c2VydmVyX3RpbWU9Mi83LzIwMjYgMzo1NDo0MiBQTSZoYXNoX3ZhbHVlPXdjQjBnd1FDZnhUUzJwNEV5TVgyclE9PSZ2YWxpZG1pbnV0ZXM9MzA=', lat: 33.5505, lon: -81.7164 },
            { id: 'c11', title: 'I-95 Exit 22', url: 'https://s20.us-east-1.skyvdn.com/rtplive/60303/chunklist_w977767992.m3u8', lat: 32.502583, lon: -80.971254 },
            { id: 'c12', title: 'Lake Keowee Marina', url: 'https://s165.ipcamlive.com/streams/a53jlsg9qwuizxpvh/stream.m3u8', lat: 34.711982, lon: -82.949066 },
            { id: 'c13', title: 'Tuscaloosa', url: 'https://video.hazcams.com/tuscaloosa-al-us-001/main_stream.m3u8', lat: 33.208856, lon: -87.550406 },
            { id: 'c14', title: 'Marietta OH', url: 'https://s161.ipcamlive.com/streams_storage/a1yonn8gzqcvwrje7/stream.m3u8', lat: 39.416016, lon: -81.456336 }
        ];
        let currentCamIndex = 0;

        let map, dashPlayer = null;

        // === INIT ===
        function init() {
            initMap();
            renderGrid();
            fetchWeather();
        }

        // === MAP SETUP (FIXED RADAR) ===
        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([37, -85], 5);
            
            // Dark Base Layer
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CartoDB',
                subdomains: 'abcd'
            }).addTo(map);

            // FIXED: US Weather Radar (IEM WMS)
            // This is more reliable than RainViewer for static HTML
            const radarLayer = L.tileLayer.wms("https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/n0r.cgi", {
                layers: 'nexrad-n0r-900913',
                format: 'image/png',
                transparent: true,
                opacity: 0.60
            }).addTo(map);

            // Camera location markers
            const camIcon = L.divIcon({
                className: 'cam-marker',
                html: '<span class="cam-marker-dot"></span>',
                iconSize: [12, 12],
                iconAnchor: [6, 6]
            });
            cameras.forEach(function (cam) {
                const marker = L.marker([cam.lat, cam.lon], { icon: camIcon }).addTo(map);
                marker.bindPopup(
                    '<div class="map-popup">' +
                    '<strong>' + escapeHtml(cam.title) + '</strong>' +
                    '<br><a href="#" class="map-popup-link" data-cam-id="' + cam.id + '">View camera</a></div>'
                );
            });
            document.body.addEventListener('click', function (e) {
                const link = e.target.closest('.map-popup-link');
                if (link && link.dataset.camId) {
                    e.preventDefault();
                    switchTab('cams');
                    openFS(link.dataset.camId);
                }
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Resolve m3u8 from embed page (e.g. Aiken SC – stream URL changes periodically)
        async function getStreamUrl(cam) {
            if (cam.resolvedUrl) return cam.resolvedUrl;
            if (!cam.resolveM3u8 || cam.url.includes('.m3u8')) return cam.url;
            try {
                const res = await fetch(cam.url, { mode: 'cors' });
                const html = await res.text();
                const m = html.match(/https?:\/\/[^\s'"<>]+\.m3u8[^\s'"<>]*/);
                if (m && m[0]) {
                    cam.resolvedUrl = m[0].replace(/\\\//g, '/');
                    return cam.resolvedUrl;
                }
            } catch (e) { /* CORS or network – fall back to iframe */ }
            return cam.url;
        }

        function openFS(id) {
            const idx = cameras.findIndex(c => c.id === id);
            if (idx >= 0) showCameraFullscreen(idx);
        }

        // === GRID RENDER ===
        function renderGrid() {
            const grid = document.getElementById('cam-grid');
            cameras.forEach(cam => {
                const div = document.createElement('div');
                div.className = 'cam-card';
                div.onclick = () => openFS(cam.id);
                
                const preview = document.createElement('div');
                preview.className = 'cam-preview loading';
                preview.id = `preview-${cam.id}`;
                
                const meta = document.createElement('div');
                meta.className = 'cam-meta';
                meta.innerHTML = `
                    <div class="cam-title">${cam.title}</div>
                    <div class="cam-weather" id="w-${cam.id}">Loading...</div>
                `;
                
                div.appendChild(preview);
                div.appendChild(meta);
                grid.appendChild(div);
                
                // Initialize preview player
                initPreviewPlayer(cam, preview);
            });
        }

        // === PREVIEW PLAYER INIT ===
        function initPreviewPlayer(cam, previewDiv) {
            function playWithUrl(streamUrl) {
                const url = streamUrl || cam.url;
                if (cam.type === 'dash' || (url && url.endsWith('.mpd'))) {
                    const video = document.createElement('video');
                    video.autoplay = true;
                    video.muted = true;
                    video.style.width = '100%';
                    video.style.height = '100%';
                    previewDiv.appendChild(video);
                    try {
                        const dp = dashjs.MediaPlayer().create();
                        dp.initialize(video, url, true);
                        dp.on('streamInitialized', () => previewDiv.classList.remove('loading'));
                    } catch (e) {
                        previewDiv.classList.remove('loading');
                        previewDiv.innerHTML = '<span style="color:#666;">Unavailable</span>';
                    }
                } else if (url && url.includes('.m3u8')) {
                    const video = document.createElement('video');
                    video.autoplay = true;
                    video.muted = true;
                    video.style.width = '100%';
                    video.style.height = '100%';
                    previewDiv.appendChild(video);
                    if (Hls.isSupported()) {
                        const hls = new Hls({ debug: false });
                        hls.loadSource(url);
                        hls.attachMedia(video);
                        hls.on(Hls.Events.MANIFEST_PARSED, () => previewDiv.classList.remove('loading'));
                        hls.on(Hls.Events.ERROR, () => {
                            previewDiv.classList.remove('loading');
                            previewDiv.innerHTML = '<span style="color:#666;">Unavailable</span>';
                        });
                    } else {
                        video.src = url;
                        previewDiv.classList.remove('loading');
                    }
                } else {
                    previewDiv.classList.remove('loading');
                    previewDiv.innerHTML = '<span style="color:#666;">Embed only</span>';
                }
            }
            if (cam.resolveM3u8 && !cam.url.includes('.m3u8')) {
                getStreamUrl(cam).then(playWithUrl);
            } else {
                playWithUrl(cam.url);
            }
        }
        

        // === WEATHER FETCH ===
        async function fetchWeather() {
            for(let cam of cameras) {
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${cam.lat}&longitude=${cam.lon}&current_weather=true&temperature_unit=fahrenheit&windspeed_unit=mph`);
                    const data = await res.json();
                    const info = `${Math.round(data.current_weather.temperature)}°F | ${Math.round(data.current_weather.windspeed)}mph`;
                    cam.weatherData = info;
                    const el = document.getElementById(`w-${cam.id}`);
                    if(el) el.innerText = info;
                } catch (e) {
                    if (document.getElementById(`w-${cam.id}`)) document.getElementById(`w-${cam.id}`).innerText = '—';
                }
            }
        }

        // === FULLSCREEN PLAYER ===
        async function showCameraFullscreen(index) {
            currentCamIndex = index;
            const cam = cameras[index];
            const overlay = document.getElementById('fs-overlay');
            const container = document.getElementById('fs-video-container');

            document.getElementById('fs-title-text').innerText = cam.title;
            document.getElementById('fs-weather-text').innerText = cam.weatherData || '—';
            overlay.style.display = 'block';

            container.innerHTML = '<p style="color:#888; padding: 20px;">Loading stream…</p>';
            if (dashPlayer) { dashPlayer.reset(); dashPlayer = null; }

            const streamUrl = await getStreamUrl(cam);

            container.innerHTML = '';
            if (cam.type === 'dash' || (streamUrl && streamUrl.endsWith('.mpd'))) {
                const video = document.createElement('video');
                video.controls = true;
                video.autoplay = true;
                video.style.width = '100%';
                video.style.height = '100%';
                container.appendChild(video);
                try {
                    dashPlayer = dashjs.MediaPlayer().create();
                    dashPlayer.initialize(video, streamUrl, true);
                    dashPlayer.on('error', function () {
                        container.innerHTML = '<p style="color:#888; padding: 20px;">Stream unavailable.</p>';
                    });
                } catch (e) {
                    container.innerHTML = '<p style="color:#888; padding: 20px;">Error loading stream.</p>';
                }
            } else if (streamUrl && streamUrl.includes('.m3u8')) {
                const video = document.createElement('video');
                video.controls = true;
                video.autoplay = true;
                video.style.width = '100%';
                video.style.height = '100%';
                container.appendChild(video);
                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(streamUrl);
                    hls.attachMedia(video);
                } else {
                    video.src = streamUrl;
                }
            } else {
                container.innerHTML = '<iframe src="' + cam.url.replace(/"/g, '&quot;') + '" style="width:100%;height:100%;border:none;"></iframe>';
            }
        }

        function loadCameraByIndex(index) {
            showCameraFullscreen(index);
        }

        function nextCamera() {
            currentCamIndex = (currentCamIndex + 1) % cameras.length;
            loadCameraByIndex(currentCamIndex);
        }
        

        function closeFS() {
            document.getElementById('fs-overlay').style.display = 'none';
            document.getElementById('fs-video-container').innerHTML = '';
            if(dashPlayer) { dashPlayer.reset(); dashPlayer = null; }
        }

        // === TAB SWITCHING ===
        window.switchTab = function (tab) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => { el.classList.remove('active'); el.removeAttribute('aria-current'); });
            if (tab === 'map') {
                document.getElementById('view-map').classList.add('active');
                document.querySelector('#nav-bar .nav-item:first-child').classList.add('active');
                document.querySelector('#nav-bar .nav-item:first-child').setAttribute('aria-current', 'page');
                map.invalidateSize();
            } else {
                document.getElementById('view-cams').classList.add('active');
                document.querySelector('#nav-bar .nav-item:last-child').classList.add('active');
                document.querySelector('#nav-bar .nav-item:last-child').setAttribute('aria-current', 'page');
            }
        };
        init();
    </script>
</body>
</html>

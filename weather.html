<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Woofter Weather | Command Center</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #050505;
            --panel: #141414;
            --accent: #00f3ff;
            --nav-height: 70px;
        }

        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: white; overflow: hidden; height: 100vh; width: 100vw; }

        /* === VIEW MANAGEMENT === */
        .view-section {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: calc(100% - var(--nav-height));
            display: none; /* Hidden by default */
            z-index: 10;
        }
        .view-section.active { display: block; }

        /* === MAP VIEW === */
        #map { height: 100%; width: 100%; background: #222; }

        /* === CAMERA GRID VIEW === */
        #cam-grid-container {
            padding: 20px;
            overflow-y: auto;
            height: 100%;
            box-sizing: border-box;
            background: linear-gradient(to bottom, #111, #000);
        }

        .grid-header { 
            margin-bottom: 20px; 
            padding-bottom: 15px; 
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            background: #111;
            z-index: 20;
        }
        .grid-header h1 { margin: 0; font-size: 1.5rem; color: var(--accent); letter-spacing: 1px; }

        .cam-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
            padding-bottom: 80px;
        }

        .cam-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .cam-card:hover { border-color: var(--accent); transform: translateY(-2px); }

        .cam-preview {
            height: 180px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 3rem;
            position: relative;
            overflow: hidden;
        }

        .cam-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cam-preview.loading::after {
            content: "⏳";
            position: absolute;
            font-size: 2rem;
        }

        .cam-meta { padding: 15px; }
        .cam-title { font-weight: 600; font-size: 1rem; margin-bottom: 5px; }
        .cam-weather { font-family: monospace; color: var(--accent); font-size: 0.85rem; }

        /* === BOTTOM NAV === */
        #nav-bar {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%;
            height: var(--nav-height);
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid #333;
            display: flex;
            z-index: 5000;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            background: none;
            border: none;
            cursor: pointer;
        }
        .nav-item.active { color: var(--accent); background: rgba(0, 243, 255, 0.05); }
        .nav-icon { font-size: 1.4rem; margin-bottom: 4px; }
        .nav-label { font-size: 0.75rem; font-weight: 600; }

        /* === FULLSCREEN OVERLAY === */
        #fs-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            display: none;
        }

        .fs-close {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            z-index: 10001;
            backdrop-filter: blur(5px);
        }

        .fs-info {
            position: absolute;
            top: 20px; left: 20px;
            z-index: 10001;
            pointer-events: none;
        }
        .fs-title { font-size: 1.2rem; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .fs-weather { color: var(--accent); font-family: monospace; font-size: 1rem; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; display: inline-block; margin-top: 5px; }

        #fs-video-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <div id="view-map" class="view-section active">
        <div id="map"></div>
    </div>

    <div id="view-cams" class="view-section">
        <div id="cam-grid-container">
            <div class="grid-header">
                <h1>TRAFFIC COMMAND</h1>
                <span style="font-size:0.8rem; color:#888;">Live Feeds & Doppler Radar</span>
            </div>
            <div id="cam-grid" class="cam-grid"></div>
        </div>
    </div>

    <div id="nav-bar">
        <button class="nav-item active" onclick="switchTab('map')">
            <span class="nav-icon">🗺️</span>
            <span class="nav-label">RADAR MAP</span>
        </button>
        <button class="nav-item" onclick="switchTab('cams')">
            <span class="nav-icon">📹</span>
            <span class="nav-label">LIVE CAMS</span>
        </button>
    </div>

    <div id="fs-overlay">
        <button class="fs-close" onclick="closeFS()">✕ CLOSE</button>
        <div class="fs-info">
            <div class="fs-title" id="fs-title-text">Camera</div>
            <div class="fs-weather" id="fs-weather-text">Loading...</div>
        </div>
        <div id="fs-video-container"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

    <script>
        // === DATA CONFIG ===
        const cameras = [
            { id: 'c1', title: 'US-50 @ MM 16.5', url: 'https://vtc3.roadsummary.com/rtplive/CAM004/playlist.m3u8', lat: 39.245052, lon: -81.391205 },
            { id: 'c2', title: 'I-77 @ 176 US 50 I/C', url: 'https://vtc3.roadsummary.com/rtplive/CAM078/playlist.m3u8', lat: 39.267584, lon: -81.499343 },
            { id: 'c3', title: 'Downtown Parkersburg', url: 'https://s117.ipcamlive.com/streams_storage/5ciuewkaxydc4tzjp/stream.m3u8', lat: 39.263304, lon: -81.564240 },
            { id: 'c5', title: 'I-77 Williamstown', url: 'https://vtc3.roadsummary.com/rtplive/CAM103/playlist.m3u8', lat: 39.399095, lon: -81.434647 },
            { id: 'c6', title: 'I-64/I-77 Charleston', url: 'https://vtc2.roadsummary.com/rtplive/CAM042/playlist.m3u8', lat: 38.3498, lon: -81.6326 },
            { id: 'c7', title: 'I-79 Clarksburg', url: 'https://vtc1.roadsummary.com/rtplive/CAM028/playlist.m3u8', lat: 39.274573, lon: -80.285608 },
            { id: 'c8', title: 'Wheeling I-70', url: 'https://vtc3.roadsummary.com/rtplive/CAM070/playlist.m3u8', lat: 40.0684, lon: -80.7183 },
            { id: 'c9', title: 'Greenville SC', url: 'https://s53.ipcamlive.com/streams/35ja3cfpmvobtxev6/stream.m3u8', lat: 34.8485, lon: -82.4000 },
            { id: 'c10', title: 'Aiken SC', url: 'https://api.wetmet.net/widgets/stream/frame.php?uid=05ba9d5621e5a7aac75a9c91f94a7c83', lat: 33.5505, lon: -81.7164 },
            { id: 'c11', title: 'I-95 Exit 22', url: 'https://s20.us-east-1.skyvdn.com/rtplive/60303/chunklist_w977767992.m3u8', lat: 32.502583, lon: -80.971254 },
            { id: 'c12', title: 'Lake Keowee Marina', url: 'https://s165.ipcamlive.com/streams/a53jlsg9qwuizxpvh/stream.m3u8', lat: 34.711982, lon: -82.949066 },
            // NEW CAMERA ADDED HERE
            { 
                id: 'tus1', 
                title: 'University Blvd / Greensboro (Tuscaloosa)', 
                url: 'https://cdn3.wowza.com/5/TEt0L1NoOHluSXc5/tuscaloosa-fastly/tus-cam-university-greensboro.stream/manifest.mpd', 
                lat: 33.2098, 
                lon: -87.5692,
                type: 'dash' 
            }
        ];

        let map, dashPlayer = null;

        // === INIT ===
        function init() {
            initMap();
            renderGrid();
            fetchWeather();
        }

        // === MAP SETUP (FIXED RADAR) ===
        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([37, -85], 5);
            
            // Dark Base Layer
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CartoDB',
                subdomains: 'abcd'
            }).addTo(map);

            // FIXED: US Weather Radar (IEM WMS)
            // This is more reliable than RainViewer for static HTML
            const radarLayer = L.tileLayer.wms("https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/n0r.cgi", {
                layers: 'nexrad-n0r-900913',
                format: 'image/png',
                transparent: true,
                opacity: 0.60
            }).addTo(map);

            // Add Markers
            cameras.forEach(cam => {
                L.marker([cam.lat, cam.lon]).addTo(map)
                    .bindTooltip(cam.title)
                    .on('click', () => openFS(cam.id));
            });
        }

        // === GRID RENDER ===
        function renderGrid() {
            const grid = document.getElementById('cam-grid');
            cameras.forEach(cam => {
                const div = document.createElement('div');
                div.className = 'cam-card';
                div.onclick = () => openFS(cam.id);
                
                const preview = document.createElement('div');
                preview.className = 'cam-preview loading';
                preview.id = `preview-${cam.id}`;
                
                const meta = document.createElement('div');
                meta.className = 'cam-meta';
                meta.innerHTML = `
                    <div class="cam-title">${cam.title}</div>
                    <div class="cam-weather" id="w-${cam.id}">Loading...</div>
                `;
                
                div.appendChild(preview);
                div.appendChild(meta);
                grid.appendChild(div);
                
                // Initialize preview player
                initPreviewPlayer(cam, preview);
            });
        }

        // === PREVIEW PLAYER INIT ===
        function initPreviewPlayer(cam, previewDiv) {
            if (cam.type === 'dash' || cam.url.endsWith('.mpd')) {
                const video = document.createElement('video');
                video.autoplay = true;
                video.muted = true;
                video.style.width = '100%';
                video.style.height = '100%';
                previewDiv.appendChild(video);
                
                try {
                    const dashPlayer = dashjs.MediaPlayer().create();
                    dashPlayer.initialize(video, cam.url, true);
                    dashPlayer.on('streamInitialized', () => {
                        previewDiv.classList.remove('loading');
                    });
                } catch(e) {
                    previewDiv.innerHTML = '<span style="color:#888;">⚠️</span>';
                }
            } else if (cam.url.includes('.m3u8')) {
                const video = document.createElement('video');
                video.autoplay = true;
                video.muted = true;
                video.style.width = '100%';
                video.style.height = '100%';
                previewDiv.appendChild(video);
                
                if (Hls.isSupported()) {
                    const hls = new Hls({ debug: false });
                    hls.loadSource(cam.url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        previewDiv.classList.remove('loading');
                    });
                    hls.on(Hls.Events.ERROR, () => {
                        previewDiv.innerHTML = '<span style="color:#888;">⚠️</span>';
                    });
                } else {
                    video.src = cam.url;
                    previewDiv.classList.remove('loading');
                }
            }
        }
        

        // === WEATHER FETCH ===
        async function fetchWeather() {
            for(let cam of cameras) {
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${cam.lat}&longitude=${cam.lon}&current_weather=true&temperature_unit=fahrenheit&windspeed_unit=mph`);
                    const data = await res.json();
                    const info = `${Math.round(data.current_weather.temperature)}°F | ${Math.round(data.current_weather.windspeed)}mph`;
                    cam.weatherData = info;
                    const el = document.getElementById(`w-${cam.id}`);
                    if(el) el.innerText = info;
                } catch(e) {}
            }
        }

        // === PLAYER LOGIC (FIXED ALABAMA) ===
        function openFS(id) {
            const cam = cameras.find(c => c.id === id);
            const overlay = document.getElementById('fs-overlay');
            const container = document.getElementById('fs-video-container');
            
            // Update Text
            document.getElementById('fs-title-text').innerText = cam.title;
            document.getElementById('fs-weather-text').innerText = cam.weatherData || '--';
            overlay.style.display = 'block';

            // Clean previous
            container.innerHTML = '';
            if(dashPlayer) { dashPlayer.reset(); dashPlayer = null; }

            // === MPEG-DASH HANDLER (For Tuscaloosa) ===
            if (cam.type === 'dash' || cam.url.endsWith('.mpd')) {
                const video = document.createElement('video');
                video.controls = true;
                video.autoplay = true;
                video.style.width = '100%';
                video.style.height = '100%';
                container.appendChild(video);

                try {
                    dashPlayer = dashjs.MediaPlayer().create();
                    dashPlayer.initialize(video, cam.url, true);
                    dashPlayer.on('error', function(e) {
                        console.error(e);
                        alert("Stream Error: The station may be offline or blocking external players.");
                    });
                } catch(e) {
                    container.innerHTML = '<p style="color:white">Error loading DASH player</p>';
                }
            } 
            // === HLS HANDLER (For Others) ===
            else if (cam.url.includes('.m3u8')) {
                const video = document.createElement('video');
                video.controls = true;
                video.autoplay = true;
                video.style.width = '100%';
                video.style.height = '100%';
                container.appendChild(video);
                
                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(cam.url);
                    hls.attachMedia(video);
                } else {
                    video.src = cam.url;
                }
            }
            // === IFRAME FALLBACK ===
            else {
                container.innerHTML = `<iframe src="${cam.url}" style="width:100%;height:100%;border:none;"></iframe>`;
            }
        }
        

        function closeFS() {
            document.getElementById('fs-overlay').style.display = 'none';
            document.getElementById('fs-video-container').innerHTML = '';
            if(dashPlayer) { dashPlayer.reset(); dashPlayer = null; }
        }

        // === TAB SWITCHING ===
        window.switchTab = function(tab) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            if(tab === 'map') {
                document.getElementById('view-map').classList.add('active');
                document.querySelector('.nav-item:nth-child(1)').classList.add('active');
                map.invalidateSize();
            } else {
                document.getElementById('view-cams').classList.add('active');
                document.querySelector('.nav-item:nth-child(2)').classList.add('active');
            }
        }

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Brighton Oaks 5K — Bib Printer</title>
  <link rel="icon" type="image/png" href="/Favicon Generator/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/Favicon Generator/favicon.svg" />
  <link rel="shortcut icon" href="/Favicon Generator/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/Favicon Generator/apple-touch-icon.png" />
  <meta name="theme-color" content="#16100a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="BO 5k" />
  <link rel="manifest" href="/Favicon Generator/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Roboto:wght@400;700&family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Oakhill';
      src: url('fonts/Oakhill.ttf') format('truetype');
    }
    @font-face {
      font-family: 'run';
      src: url('fonts/RUNNING DEMO.otf') format('opentype');
    }
    :root {
      --accent: #5d7c34;
      --accent2: #d2762e;
      --bg: #16100a;
      --card: #271c11;
      --text: #f1e6cf;
      --muted: #c0a982;
      --shadow: 0 6px 20px rgba(8, 4, 0, 0.5);
      --display: 'Rye', 'Oakhill', Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse at 18% -10%, rgba(210, 118, 46, 0.10), transparent 55%),
        radial-gradient(ellipse at 85% 112%, rgba(122, 84, 44, 0.14), transparent 62%);
      background-attachment: fixed;
      color: var(--text);
    }
    .navbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 28px; background: rgba(22, 16, 10, 0.95); box-shadow: var(--shadow);
      border-bottom: 2px solid rgba(201, 162, 109, 0.28);
      position: sticky; top: 0; z-index: 100;
    }
    .navbar .logo {
      display: flex; align-items: center; gap: 12px;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent2);
      font-family: var(--display);
    }
    .navbar .logo img { height: 46px; border-radius: 8px; }
    .navbar .nav-links { 
      font-family: 'run', sans-serif;
      display: flex; 
      gap: 14px; 
    }
    .navbar a {
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      transition: all 0.3s ease;
      padding: 8px 16px;
      border-radius: 8px;
    }
    .navbar a:hover {
      color: var(--accent2);
      background: rgba(255, 127, 17, 0.1);
      transform: translateY(-1px);
    }
    .navbar a.active {
      background: var(--accent);
      color: white;
    }

    body {
      text-align: center;
      padding: 20px;
    }

    .header {
      background: var(--card);
      padding: 24px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      margin: 20px auto;
      max-width: 800px;
    }
    
    h1 {
      color: var(--accent2);
      font-family: var(--display);
      font-weight: 400;
      margin: 0;
      font-size: 2rem;
    }

    .settings-panel {
      background: var(--card);
      padding: 20px;
      border-radius: 16px;
      margin: 20px auto;
      max-width: 800px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .settings-panel h3 {
      color: var(--accent2);
      margin-top: 0;
    }

    button, input[type="file"] {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      font-weight: bold;
      background: var(--accent2);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255,127,17,0.3);
    }

    /* Dark digits on cream paper — legible for runners and for the finish-cam OCR */
    .bib {
      width: 800px;
      height: 500px;
      border: 5px solid var(--accent2);
      border-radius: 20px;
      margin: 30px auto;
      background: linear-gradient(175deg, #f6ecd6 0%, #ead9b3 100%);
      position: relative;
      box-shadow: var(--shadow);
      page-break-after: always;
      display: flex;
      flex-direction: column;
      padding: 30px;
      color: #1c1206;
    }

    .race-title {
      font-family: var(--display);
      font-size: 48px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #a4611f;
      text-align: center;
    }

    .bib-number {
      font-size: 200px;
      font-weight: 900;
      margin: 0;
      text-align: center;
      color: #100a02;
      line-height: 1;
      font-family: 'Inter', sans-serif;
    }

    .runner-name {
      font-size: 48px;
      font-weight: bold;
      text-align: center;
      margin: 20px 0;
      color: #1c1206;
      font-family: 'Special Elite', 'Courier New', monospace;
    }

    .estimated-time {
      font-size: 32px;
      font-weight: 500;
      text-align: center;
      color: #4a3520;
      font-family: 'Special Elite', 'Courier New', monospace;
    }

    .bib-logo {
      position: absolute;
      left: 40px;
      bottom: 40px;
      width: 150px;
      height: auto;
    }

    .qr-code {
      position: absolute;
      right: 40px;
      bottom: 40px;
      background: white;
      padding: 10px;
      border-radius: 8px;
    }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--accent);
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      z-index: 1000;
      opacity: 0;
      transform: translateX(100%);
      transition: all 0.3s ease;
    }

    .notification.show {
      opacity: 1;
      transform: translateX(0);
    }

    .notification.error {
      background: #dc3545;
    }

    .footer {
      background: rgba(22, 16, 10, 0.96);
      color: var(--muted);
      text-align: center;
      padding: 30px 12px;
      margin-top: 60px;
      border-top: 2px solid rgba(201, 162, 109, 0.28);
    }
    .footer-art {
      height: 60px;
      margin-bottom: 10px;
    }

    @media print {
      body {
        background: white;
        margin: 0;
        padding: 0;
      }
      .navbar, .footer, button, input[type="file"], h1, p, .settings-panel, .notification {
        display: none !important;
      }
      .bib {
        box-shadow: none;
        margin: 0 auto;
        border: 4px solid #000;
        background: white;
        color: #000;
        width: 100%;
        height: 100%;
        page-break-after: always;
      }
      .race-title {
        color: #000;
        font-family: var(--display);
      }
      .bib-number {
        color: #000;
      }
      .runner-name {
        color: #000;
        font-family: 'Special Elite', 'Courier New', monospace;
      }
      .estimated-time {
        color: #000;
        font-family: 'Special Elite', 'Courier New', monospace;
      }
      .qr-code {
        border: 1px solid #ddd;
      }
    }

    @media (max-width: 768px) {
      .bib {
        width: 100%;
        height: auto;
        aspect-ratio: 7/4;
        padding: 15px;
      }
      .race-title { font-size: 28px; }
      .bib-number { font-size: 120px; }
      .runner-name { font-size: 24px; }
      button { font-size: 14px; padding: 8px 16px; }
    }

    /* Mobile Optimizations */
    @media screen and (max-width: 900px) {
      body {
        padding: 10px;
      }
      
      .header {
        padding: 16px;
        margin: 10px auto;
      }
      
      .settings-panel {
        padding: 15px;
        margin: 10px auto;
      }
      
      button {
        width: calc(100% - 20px);
        margin: 5px 10px;
        padding: 12px 16px;
        font-size: 15px;
      }
      
      .bib {
        width: 100%;
        max-width: 500px;
        height: auto;
        aspect-ratio: 8/5;
        padding: 20px;
        margin: 15px auto;
      }
      
      .race-title {
        font-size: 32px;
        margin-bottom: 10px;
      }
      
      .bib-number {
        font-size: 120px;
      }
      
      .runner-name {
        font-size: 32px;
        margin: 10px 0;
      }
      
      .estimated-time {
        font-size: 24px;
      }
      
      .bib-logo {
        width: 80px;
        left: 20px;
        bottom: 20px;
      }
      
      .qr-code {
        right: 20px;
        bottom: 20px;
        padding: 5px;
      }
      
      .qr-code img {
        width: 60px !important;
        height: 60px !important;
      }
    }

    @media screen and (max-width: 480px) {
      /* the logo and the links can no longer share one row on a phone */
      .navbar {
        padding: 10px;
        flex-wrap: wrap;
        gap: 8px;
      }
      
      .navbar .logo {
        font-size: 1.2rem;
      }
      
      .navbar .nav-links {
        gap: 6px;
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .navbar .nav-links::-webkit-scrollbar { display: none; }
      
      .navbar a {
        padding: 6px 10px;
        font-size: 14px;
      }
      
      .bib {
        padding: 15px;
      }
      
      .race-title {
        font-size: 24px;
      }
      
      .bib-number {
        font-size: 90px;
      }
      
      .runner-name {
        font-size: 24px;
      }
      
      .estimated-time {
        font-size: 18px;
      }
      
      .bib-logo {
        width: 60px;
        left: 15px;
        bottom: 15px;
      }
      
      .qr-code {
        right: 15px;
        bottom: 15px;
      }
      
      .qr-code img {
        width: 50px !important;
        height: 50px !important;
      }
    }

    /* Touch optimizations */
    @media (hover: none) {
      button {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      
      button:active {
        transform: scale(0.98);
      }
      
      .notification {
        bottom: 20px;
        top: auto;
        left: 50%;
        transform: translateX(-50%) translateY(100%);
        width: 90%;
        max-width: 400px;
        text-align: center;
      }
      
      .notification.show {
        transform: translateX(-50%) translateY(0);
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><img src="images/bright1.png" alt="Brighton Oaks 5K" /> Brighton Oaks 5k</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="registration.html">Register</a>
      <a href="results.html">Results</a>
      <a href="bibprinter.html" class="active">Bib Printer</a>
    </div>
  </nav>
  <div class="header">
    <h1>Race Bib Maker</h1>
  </div>
  <div class="settings-panel">
    <h3>Settings</h3>
    <label>
      <input type="checkbox" id="skipConfirmations" checked>
      Skip confirmation dialogs (faster operation)
    </label>
    <label>
      <input type="checkbox" id="showNotifications" checked>
      Show success notifications
    </label>
  </div>
  <p>Race logo: <strong>images/bright.png</strong> (automatically loaded)</p>
  <button onclick="loadRunners()">Load Runners & Generate Bibs</button>
  <button onclick="exportPdf()" style="background:#5d7c34; color:white;">⬇ Export PDF (one bib per page)</button>
  <button onclick="printBibs()">Print Bibs</button>
  <button onclick="manualPrint()" style="background:#17a2b8; color:white;">Manual Print (Ctrl+P)</button>
  <div id="bibs"></div>
  <div id="notification" class="notification"></div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";
    import { computeBibs, normalizeCustomBib } from "./race-core.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDUnAV-DL-Saw2ByPY6GF8aDaZbVCXDIH4",
      authDomain: "the-race-organizer.firebaseapp.com",
      databaseURL: "https://the-race-organizer-default-rtdb.firebaseio.com",
      projectId: "the-race-organizer",
      storageBucket: "the-race-organizer.firebasestorage.app",
      messagingSenderId: "265977321479",
      appId: "1:265977321479:web:23d3f3077e8e766323b2a2",
      measurementId: "G-PKGPD78DYM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Make functions globally available
    window.loadRunners = async function() {
      try {
        const bibsContainer = document.getElementById('bibs');
        bibsContainer.innerHTML = '';
        
        const registrationsRef = ref(db, 'registrations');
        const snapshot = await get(registrationsRef);
        
        if (snapshot.exists()) {
          const registrations = snapshot.val();

          // Custom bib number requests are honored only when the organizer selects yes
          const settingsSnap = await get(ref(db, 'settings/customBibs'));
          const allowCustom = !!settingsSnap.val();

          const entries = Object.entries(registrations).map(([id, r]) => ({ id, ...r }));
          const bibs = computeBibs(entries, allowCustom);
          const runners = entries
            .map((r) => ({ ...r, bib: bibs[r.id] }))
            .sort((a, b) => (a.estimatedTime || 0) - (b.estimatedTime || 0));

          const customCount = allowCustom
            ? runners.filter((r) => normalizeCustomBib(r.customBib) === r.bib).length
            : 0;

          runners.forEach((runner) => {
            const bib = generateBib(runner);
            bibsContainer.appendChild(bib);
          });
          
          showNotification(`Generated ${runners.length} bibs` +
            (allowCustom
              ? (customCount ? ` · ${customCount} custom number${customCount === 1 ? '' : 's'} honored` : '')
              : ' · custom requests ignored (organizer setting is off)'));
        } else {
          showNotification('No registrations found', 'error');
        }
      } catch (error) {
        console.error('Error loading runners:', error);
        showNotification('Failed to load runners: ' + error.message, 'error');
      }
    };

    window.printBibs = function() {
      const bibsContainer = document.getElementById('bibs');
      if (!bibsContainer.children.length) {
        showNotification('Generate bibs first', 'warning');
        return;
      }
      
      showNotification('Preparing print...');
      
      // Ensure print styles are applied
      setTimeout(() => {
        try {
          window.print();
          showNotification('Print dialog opened');
        } catch (error) {
          console.error('Print error:', error);
          showNotification('Print failed. Try manual print', 'error');
        }
      }, 200);
    };

    window.manualPrint = function() {
      const bibsContainer = document.getElementById('bibs');
      if (!bibsContainer.children.length) {
        showNotification('Generate bibs first', 'warning');
        return;
      }
      showNotification('Use Ctrl+P or Cmd+P to print');
    };

    /* ---------- PDF export: one bib per landscape page, print-ready ---------- */

    function imageDataUrl(src, maxW = 0) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const scale = maxW && img.naturalWidth > maxW ? maxW / img.naturalWidth : 1;
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.naturalWidth * scale));
          c.height = Math.max(1, Math.round(img.naturalHeight * scale));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve({ dataUrl: c.toDataURL('image/png'), w: c.width, h: c.height });
        };
        img.onerror = () => reject(new Error('could not load ' + src));
        img.src = src;
      });
    }

    function qrDataUrl(bibEl) {
      const el = bibEl.querySelector('.qr-code canvas, .qr-code img');
      if (!el) return null;
      return el.tagName === 'CANVAS' ? el.toDataURL('image/png') : (el.src || null);
    }

    /** Build the bibs PDF and return the jsPDF doc (exportPdf saves it). */
    window.buildBibsPdf = async function() {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'letter' });
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();

      // 22mm at ~300dpi ≈ 260px — keeps the PDF light and print-sharp
      let logo = null;
      try { logo = await imageDataUrl('images/bright.png', 260); } catch { /* logo optional */ }

      const bibEls = [...document.querySelectorAll('#bibs .bib')];
      bibEls.forEach((bibEl, i) => {
        if (i > 0) pdf.addPage();

        const number = (bibEl.querySelector('.bib-number')?.textContent || '----').trim();
        const name = (bibEl.querySelector('.runner-name')?.textContent || '').trim();
        const est = (bibEl.querySelector('.estimated-time')?.textContent || '').trim();

        // same 800x500 (1.6) panel ratio as the on-screen / print bibs
        const bibW = pageW - 20;
        const bibH = bibW / 1.6;
        const bibX = (pageW - bibW) / 2;
        const bibY = (pageH - bibH) / 2;
        const cx = pageW / 2;

        pdf.setDrawColor(210, 118, 46);
        pdf.setLineWidth(1.6);
        pdf.roundedRect(bibX, bibY, bibW, bibH, 3, 3);

        pdf.setTextColor(164, 97, 31);
        pdf.setFont('times', 'bold');
        pdf.setFontSize(26);
        pdf.text('BRIGHTON OAKS 5K', cx, bibY + 17, { align: 'center' });

        pdf.setTextColor(16, 10, 2);
        pdf.setFont('helvetica', 'bold');
        pdf.setFontSize(112);
        pdf.text(number, cx, bibY + 88, { align: 'center' });

        pdf.setFont('courier', 'bold');
        let nameSize = 24;
        pdf.setFontSize(nameSize);
        while (nameSize > 12 && pdf.getTextWidth(name) > bibW - 60) {
          nameSize--;
          pdf.setFontSize(nameSize);
        }
        pdf.text(name, cx, bibY + 112, { align: 'center' });

        pdf.setTextColor(74, 53, 32);
        pdf.setFont('courier', 'normal');
        pdf.setFontSize(14);
        pdf.text(est, cx, bibY + 128, { align: 'center' });

        if (logo) {
          const logoW = 22;
          const logoH = (logo.h / logo.w) * logoW;
          pdf.addImage(logo.dataUrl, 'PNG', bibX + 11, bibY + bibH - 10 - logoH, logoW, logoH);
        }

        const qr = qrDataUrl(bibEl);
        if (qr) {
          const qrS = 26;
          const qrX = bibX + bibW - 11 - qrS;
          const qrY = bibY + bibH - 10 - qrS;
          pdf.setFillColor(255, 255, 255);
          pdf.rect(qrX - 1.5, qrY - 1.5, qrS + 3, qrS + 3, 'F');
          pdf.addImage(qr, 'PNG', qrX, qrY, qrS, qrS);
          pdf.setDrawColor(180, 150, 110);
          pdf.setLineWidth(0.4);
          pdf.rect(qrX - 1.5, qrY - 1.5, qrS + 3, qrS + 3);
        }
      });

      return pdf;
    };

    /** Download all generated bibs as one print-ready PDF. */
    window.exportPdf = async function() {
      const bibsContainer = document.getElementById('bibs');
      if (!bibsContainer.children.length) await window.loadRunners();
      if (!bibsContainer.children.length) {
        showNotification('No bibs to export — no registrations found', 'error');
        return;
      }
      if (!window.jspdf) {
        showNotification('PDF library failed to load — check your connection', 'error');
        return;
      }
      showNotification('Building PDF…');
      try {
        const pdf = await window.buildBibsPdf();
        const n = pdf.internal.getNumberOfPages();
        pdf.save('brighton-oaks-5k-bibs.pdf');
        showNotification(`Bibs PDF downloaded — ${n} page${n === 1 ? '' : 's'}, one bib per page`);
      } catch (err) {
        console.error('PDF export failed', err);
        showNotification('PDF export failed: ' + err.message, 'error');
      }
    };

    function generateBib(runner) {
      const bib = document.createElement('div');
      bib.className = 'bib';
      
      const number = document.createElement('div');
      number.className = 'bib-number';
      number.textContent = runner.bib || '0000';
      
      const title = document.createElement('div');
      title.className = 'race-title';
      title.textContent = 'Brighton Oaks 5K';
      
      const name = document.createElement('div');
      name.className = 'runner-name';
      name.textContent = runner.name;
      
      const estTime = document.createElement('div');
      estTime.className = 'estimated-time';
      estTime.textContent = 'Est: ' + formatTime(runner.estimatedTime || 0);
      
      const logo = document.createElement('img');
      logo.className = 'bib-logo';
      logo.src = 'images/bright.png';
      logo.alt = 'Brighton Oaks 5K';
      
      const qrContainer = document.createElement('div');
      qrContainer.className = 'qr-code';
      
      bib.appendChild(title);
      bib.appendChild(number);
      bib.appendChild(name);
      bib.appendChild(estTime);
      bib.appendChild(logo);
      bib.appendChild(qrContainer);
      
      // Generate QR code
      new QRCode(qrContainer, {
        text: `http://sjwooft1.github.io/results.html`,
        width: 100,
        height: 100
      });
      
      return bib;
    }

    function formatTime(ms) {
      const minutes = Math.floor(ms / 60000);
      const seconds = Math.floor((ms % 60000) / 1000);
      const milliseconds = ms % 1000;
      return `${minutes}:${String(seconds).padStart(2, '0')}.${String(milliseconds).padStart(3, '0')}`;
    }

    function showNotification(message, type = 'success') {
      const notification = document.getElementById('notification');
      const showNotifications = document.getElementById('showNotifications');
      
      if (!showNotifications || !showNotifications.checked) return;
      
      notification.textContent = message;
      notification.className = `notification ${type}`;
      notification.classList.add('show');
      
      setTimeout(() => {
        notification.classList.remove('show');
      }, 3000);
    }

    // Expose showNotification globally
    window.showNotification = showNotification;

    // Auto-load runners if specified in URL
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('autoload') === 'true') {
        window.loadRunners();
      }
    });
  </script>
